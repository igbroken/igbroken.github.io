<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OléPDF</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>OléPDF</h1>
      <p class="lead">PDF tools with a working frontend and backend starter.</p>

      <section class="panel">
        <h2>Backend status</h2>
        <p id="health-status">Checking backend...</p>
      </section>

      <section class="panel">
        <h2>Contact support</h2>
        <form id="contact-form" novalidate>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required maxlength="80" />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required maxlength="120" />

          <label for="message">Message</label>
          <textarea id="message" name="message" required maxlength="1000"></textarea>

          <button type="submit">Send</button>
        </form>
        <p id="contact-status" role="status"></p>
      </section>
    </main>

    <script>
      const healthStatus = document.getElementById("health-status");
      const contactForm = document.getElementById("contact-form");
      const contactStatus = document.getElementById("contact-status");

      async function checkHealth() {
        try {
          const response = await fetch("/api/health");
          if (!response.ok) {
            throw new Error("Health check failed");
          }
          const data = await response.json();
          healthStatus.textContent = `Online (${data.status})`;
          healthStatus.className = "ok";
        } catch (error) {
          healthStatus.textContent = "Backend is unavailable.";
          healthStatus.className = "error";
        }
      }

      contactForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        contactStatus.textContent = "Sending...";
        contactStatus.className = "";

        const formData = new FormData(contactForm);
        const payload = {
          name: formData.get("name")?.toString().trim(),
          email: formData.get("email")?.toString().trim(),
          message: formData.get("message")?.toString().trim()
        };

        if (!payload.name || !payload.email || !payload.message) {
          contactStatus.textContent = "Please complete all fields.";
          contactStatus.className = "error";
          return;
        }

        try {
          const response = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error("Request failed");
          }

          contactForm.reset();
          contactStatus.textContent = "Message sent.";
          contactStatus.className = "ok";
        } catch (error) {
          contactStatus.textContent = "Could not send message.";
          contactStatus.className = "error";
        }
      });

      try {
        const pageview = {
          path: window.location.pathname,
          referrer: document.referrer,
          user_agent: navigator.userAgent
        };
        navigator.sendBeacon("/api/stats/pageview", JSON.stringify(pageview));
      } catch (error) {
        // Ignore beacon errors
      }

      checkHealth();
    </script>
  </body>
</html>
